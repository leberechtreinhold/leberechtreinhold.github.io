<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Triumph! Army Lists</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css"
        />
        <style>
            :root {
                --bulma-strong-color: #008f86;
                --theme-green: #008f86;
                --theme-green-soft: #eaf6ee;
                --theme-green-mid: #cfe9d7;
                --theme-text: #1b1b1b;
                --theme-bg: #ffffff;
            }

            html,
            body,
            .section,
            .container {
                background: var(--theme-bg) !important;
                color: var(--theme-text) !important;
            }

            .title {
                color: var(--theme-text) !important;
            }

            .hero.is-triumph {
                background: linear-gradient(135deg, #00b7a8 0%, #008f86 100%);
                border-bottom: 1px solid #007a72;
            }

            .hero.is-triumph .title {
                color: #ffffff !important;
                margin-bottom: 0;
            }

            .box {
                background: #ffffff !important;
                color: var(--theme-text) !important;
                border: 1px solid var(--theme-green-mid);
                box-shadow: none;
            }

            .table,
            .table td,
            .table th {
                background: #ffffff !important;
                color: var(--theme-text) !important;
            }

            .table th,
            .table td {
                border-color: var(--theme-green) !important;
            }

            .table thead th {
                background: var(--theme-green) !important;
                color: #ffffff !important;
            }

            .table thead th a {
                color: #ffffff !important;
                text-decoration: none;
                font-weight: 700;
            }

            .table thead th.sortable {
                cursor: pointer;
                user-select: none;
            }

            .table thead th .sort-indicator {
                margin-left: 0.35rem;
                font-size: 0.9rem;
                opacity: 0.95;
            }

            .table tbody tr:hover td {
                background: #86d8cb !important;
                color: #ffffff !important;
            }

            .table tbody tr:hover a {
                color: #ffffff !important;
            }

            a {
                color: var(--theme-green);
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <section class="hero is-triumph">
            <div class="hero-body">
                    <h1 class="title">Triumph! Army Lists</h1>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="box">
                    <div class="table-container">
                        <table id="army-table" class="table is-striped is-hoverable is-fullwidth">
                            <thead>
                                <tr>
                                    <th class="sortable" data-col="0" data-type="text">
                                        Army<span class="sort-indicator"></span>
                                    </th>
                                    <th class="sortable" data-col="1" data-type="number">
                                        Start Date<span class="sort-indicator"></span>
                                    </th>
                                    <th class="sortable" data-col="2" data-type="number">
                                        End Date<span class="sort-indicator"></span>
                                    </th>
                                    <th class="sortable" data-col="3" data-type="text">
                                        Category<span class="sort-indicator"></span>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for row in army_rows %}
                                    <tr>
                                        <td data-sort-value="{{ row.army_sort }}"><a href="{{ url_for('army_detail', army_id=row.army_id) }}">{{ row.army }}</a></td>
                                        <td data-sort-value="{{ row.start_date_value if row.start_date_value is not none else '' }}">{{ row.start_date }}</td>
                                        <td data-sort-value="{{ row.end_date_value if row.end_date_value is not none else '' }}">{{ row.end_date }}</td>
                                        <td data-sort-value="{{ row.category_sort }}">{{ row.category }}</td>
                                    </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <script>
            (() => {
                const table = document.getElementById("army-table");
                if (!table) return;

                const tbody = table.querySelector("tbody");
                const headers = Array.from(table.querySelectorAll("thead th.sortable"));
                let currentSort = { col: 1, dir: "asc" };

                function valueFor(row, col, type) {
                    const cell = row.cells[col];
                    const raw = (cell.dataset.sortValue || "").trim();

                    if (type === "number") {
                        if (raw === "") return Number.POSITIVE_INFINITY;
                        const num = Number(raw);
                        return Number.isNaN(num) ? Number.POSITIVE_INFINITY : num;
                    }

                    return raw.toLowerCase();
                }

                function updateIndicators() {
                    headers.forEach((header) => {
                        const indicator = header.querySelector(".sort-indicator");
                        const col = Number(header.dataset.col);
                        if (!indicator) return;

                        if (col === currentSort.col) {
                            indicator.textContent = currentSort.dir === "asc" ? "↑" : "↓";
                        } else {
                            indicator.textContent = "";
                        }
                    });
                }

                function sortBy(col, type, dir) {
                    const rows = Array.from(tbody.querySelectorAll("tr"));
                    rows.sort((a, b) => {
                        const va = valueFor(a, col, type);
                        const vb = valueFor(b, col, type);

                        if (type === "number") {
                            return dir === "asc" ? va - vb : vb - va;
                        }

                        return dir === "asc"
                            ? va.localeCompare(vb)
                            : vb.localeCompare(va);
                    });

                    rows.forEach((row) => tbody.appendChild(row));
                    currentSort = { col, dir };
                    updateIndicators();
                }

                headers.forEach((header) => {
                    header.addEventListener("click", () => {
                        const col = Number(header.dataset.col);
                        const type = header.dataset.type || "text";
                        const dir =
                            currentSort.col === col && currentSort.dir === "asc"
                                ? "desc"
                                : "asc";
                        sortBy(col, type, dir);
                    });
                });

                sortBy(1, "number", "asc");
            })();
        </script>
    </body>
</html>
