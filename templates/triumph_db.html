<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Triumph! Army Lists</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css"
        />
        <style>
            :root {
                --bulma-strong-color: #008f86;
                --theme-green: #008f86;
                --theme-green-soft: #eaf6ee;
                --theme-green-mid: #cfe9d7;
                --theme-text: #1b1b1b;
                --theme-bg: #ffffff;
            }

            html,
            body,
            .section,
            .container {
                background: var(--theme-bg) !important;
                color: var(--theme-text) !important;
            }

            .title {
                color: var(--theme-text) !important;
            }

            .hero.is-triumph {
                background: linear-gradient(135deg, #00b7a8 0%, #008f86 100%);
                border-bottom: 1px solid #007a72;
            }

            .hero.is-triumph .title {
                color: #ffffff !important;
                margin-bottom: 0;
            }

            .language-switcher {
                position: fixed;
                top: 1rem;
                right: 1rem;
                z-index: 20;
                display: inline-flex;
                align-items: center;
                gap: 0.45rem;
            }

            .language-switcher .github-link {
                width: 2rem;
                height: 2rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: 1px solid rgba(255, 255, 255, 0.45);
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.16);
                color: #ffffff;
            }

            .language-switcher .github-link:hover {
                background: rgba(255, 255, 255, 0.24);
            }

            .language-switcher .github-link svg {
                width: 1.1rem;
                height: 1.1rem;
                fill: currentColor;
            }

            .language-switcher select {
                border: 1px solid rgba(255, 255, 255, 0.45);
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.16);
                color: #ffffff;
                font-size: 1.1rem;
                line-height: 1;
                padding: 0.45rem 0.45rem 0.45rem 0.65rem;
                cursor: pointer;
            }

            .language-switcher select option {
                color: var(--theme-text);
                background: #ffffff;
            }

            .box {
                background: #ffffff !important;
                color: var(--theme-text) !important;
                border: 1px solid var(--theme-green-mid);
                box-shadow: none;
            }

            .table,
            .table td,
            .table th {
                background: #ffffff !important;
                color: var(--theme-text) !important;
            }

            .table th,
            .table td {
                border-color: var(--theme-green) !important;
            }

            .table thead th {
                background: var(--theme-green) !important;
                color: #ffffff !important;
            }

            .table thead th a {
                color: #ffffff !important;
                text-decoration: none;
                font-weight: 700;
            }

            .table thead th.sortable {
                cursor: pointer;
                user-select: none;
            }

            .table thead th .sort-indicator {
                margin-left: 0.35rem;
                font-size: 0.9rem;
                opacity: 0.95;
            }

            .table tbody tr:hover td {
                background: #86d8cb !important;
                color: #ffffff !important;
            }

            .table tbody tr:hover a {
                color: #ffffff !important;
            }

            .table th:nth-child(2),
            .table td:nth-child(2),
            .table th:nth-child(3),
            .table td:nth-child(3) {
                white-space: nowrap;
                min-width: 8ch;
            }

            a {
                color: var(--theme-green);
                font-weight: 600;
                
            }
        </style>
    </head>
    <body>
        <div class="language-switcher">
            <a
                class="github-link"
                href="https://github.com/leberechtreinhold/leberechtreinhold.github.io"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open GitHub repository"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 0.3C5.4 0.3 0 5.7 0 12.3c0 5.3 3.4 9.8 8.2 11.4 0.6 0.1 0.8-0.3 0.8-0.6 0-0.3 0-1.1 0-2.1-3.3 0.7-4-1.4-4-1.4-0.5-1.4-1.3-1.7-1.3-1.7-1.1-0.7 0.1-0.7 0.1-0.7 1.2 0.1 1.9 1.3 1.9 1.3 1.1 1.8 2.8 1.3 3.5 1 0.1-0.8 0.4-1.3 0.8-1.6-2.7-0.3-5.5-1.3-5.5-6 0-1.3 0.5-2.4 1.2-3.2-0.1-0.3-0.5-1.5 0.1-3.1 0 0 1-0.3 3.3 1.2 1-0.3 2-0.4 3-0.4s2.1 0.1 3 0.4c2.3-1.5 3.3-1.2 3.3-1.2 0.7 1.6 0.3 2.8 0.1 3.1 0.8 0.8 1.2 1.9 1.2 3.2 0 4.7-2.8 5.7-5.5 6 0.4 0.4 0.8 1.1 0.8 2.2 0 1.6 0 2.8 0 3.2 0 0.3 0.2 0.7 0.8 0.6 4.7-1.6 8.2-6.1 8.2-11.4C24 5.7 18.6 0.3 12 0.3z" />
                </svg>
            </a>
            <label for="language-select" class="is-sr-only">Language</label>
            <select id="language-select" aria-label="Language selector">
                <option value="en">🇬🇧</option>
                <option value="es">🇪🇸</option>
            </select>
        </div>
        <section class="hero is-triumph">
            <div class="hero-body">
                    <h1 class="title">Triumph! Army Lists</h1>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="box">
                    <div class="table-container">
                        <table id="army-table" class="table is-striped is-hoverable is-fullwidth">
                            <thead>
                                <tr>
                                    <th class="sortable" data-col="0" data-type="text" data-lang-en="Army" data-lang-es="Ejército">
                                        Army<span class="sort-indicator"></span>
                                    </th>
                                    <th class="sortable" data-col="1" data-type="number" data-lang-en="Start Date" data-lang-es="Inicio">
                                        Start Date<span class="sort-indicator"></span>
                                    </th>
                                    <th class="sortable" data-col="2" data-type="number" data-lang-en="End Date" data-lang-es="Fin">
                                        End Date<span class="sort-indicator"></span>
                                    </th>
                                    <th class="sortable" data-col="3" data-type="text" data-lang-en="Category" data-lang-es="Categorías">
                                        Category<span class="sort-indicator"></span>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for row in army_rows %}
                                    <tr>
                                        <td data-sort-value="{{ row.army_sort }}" data-lang-en="{{ row.army }}" data-lang-es="{{ row.army_lang_es }}"><a href="{{ url_for('army_detail', army_id=row.army_id) }}">{{ row.army }}</a></td>
                                        <td data-sort-value="{{ row.start_date_value if row.start_date_value is not none else '' }}">{{ row.start_date }}</td>
                                        <td data-sort-value="{{ row.end_date_value if row.end_date_value is not none else '' }}">{{ row.end_date }}</td>
                                        <td data-sort-value="{{ row.category_sort }}" data-lang-en="{{ row.category }}" data-lang-es="{{ row.category_lang_es }}">{{ row.category }}</td>
                                    </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <script>
            (() => {
                const table = document.getElementById("army-table");
                const languageSelect = document.getElementById("language-select");
                if (!table) return;

                const tbody = table.querySelector("tbody");
                const headers = Array.from(table.querySelectorAll("thead th.sortable"));
                let currentSort = { col: 1, dir: "asc" };

                function applyLanguage(language) {
                    // Update all elements with data-lang-en and data-lang-es attributes
                    const elements = table.querySelectorAll("[data-lang-en][data-lang-es]");
                    elements.forEach((element) => {
                        const value =
                            language === "es"
                                ? element.dataset.langEs || ""
                                : element.dataset.langEn || "";

                        // If element has a link, update the link text; otherwise update the cell text
                        const link = element.querySelector("a");
                        if (link) {
                            link.textContent = value;
                        } else {
                            element.textContent = value;
                        }

                        if (element.dataset.sortValue !== undefined) {
                            element.dataset.sortValue = value.trim().toLowerCase();
                        }
                    });
                }

                function valueFor(row, col, type) {
                    const cell = row.cells[col];
                    const raw = (cell.dataset.sortValue || "").trim();

                    if (type === "number") {
                        if (raw === "") return Number.POSITIVE_INFINITY;
                        const num = Number(raw);
                        return Number.isNaN(num) ? Number.POSITIVE_INFINITY : num;
                    }

                    return raw.toLowerCase();
                }

                function updateIndicators() {
                    headers.forEach((header) => {
                        const indicator = header.querySelector(".sort-indicator");
                        const col = Number(header.dataset.col);
                        if (!indicator) return;

                        if (col === currentSort.col) {
                            indicator.textContent = currentSort.dir === "asc" ? "↑" : "↓";
                        } else {
                            indicator.textContent = "";
                        }
                    });
                }

                function sortBy(col, type, dir) {
                    const rows = Array.from(tbody.querySelectorAll("tr"));
                    rows.sort((a, b) => {
                        const va = valueFor(a, col, type);
                        const vb = valueFor(b, col, type);

                        if (type === "number") {
                            return dir === "asc" ? va - vb : vb - va;
                        }

                        return dir === "asc"
                            ? va.localeCompare(vb)
                            : vb.localeCompare(va);
                    });

                    rows.forEach((row) => tbody.appendChild(row));
                    currentSort = { col, dir };
                    updateIndicators();
                }

                headers.forEach((header) => {
                    header.addEventListener("click", () => {
                        const col = Number(header.dataset.col);
                        const type = header.dataset.type || "text";
                        const dir =
                            currentSort.col === col && currentSort.dir === "asc"
                                ? "desc"
                                : "asc";
                        sortBy(col, type, dir);
                    });
                });

                if (languageSelect) {
                    languageSelect.addEventListener("change", (event) => {
                        applyLanguage(event.target.value);
                    });
                }

                sortBy(1, "number", "asc");
                applyLanguage(languageSelect ? languageSelect.value : "en");
            })();
        </script>
    </body>
</html>
