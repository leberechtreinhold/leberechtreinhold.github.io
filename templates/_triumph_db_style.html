<style>
    :root {
        --bulma-strong-color: #008f86;
        --theme-green: #008f86;
        --theme-green-soft: #eaf6ee;
        --theme-green-mid: #cfe9d7;
        --theme-text: #1b1b1b;
        --theme-bg: #ffffff;
    }

    html,
    body,
    .section,
    .container {
        background: var(--theme-bg) !important;
        color: var(--theme-text) !important;
    }

    .title {
        color: var(--theme-text) !important;
    }

    body[data-lang="es"] .html-lang-en { display: none; }
    body[data-lang="en"] .html-lang-es,
    body:not([data-lang]) .html-lang-es { display: none; }

    h3,
    h4,
    .title.is-2,
    .title.is-3,
    .title.is-4,
    .title.is-5 {
        color: var(--theme-green) !important;
    }

    .hero.is-triumph {
        background: linear-gradient(135deg, #00b7a8 0%, #008f86 100%);
        border-bottom: 1px solid #007a72;
        padding-top: 3.5rem;
    }

    @media (max-width: 600px) {
        .hero.is-triumph {
            padding-top: 7rem;
        }
    }

    .hero.is-triumph .title {
        color: #ffffff !important;
        margin-bottom: 0;
    }

    .language-switcher {
        position: fixed;
        top: 0.5rem;
        right: 0.75rem;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.45rem;
        max-width: calc(100vw - 1.5rem);
        justify-content: flex-end;
    }

    @media (max-width: 600px) {
        .language-switcher {
            top: 0;
            right: 0;
            left: 0;
            max-width: 100%;
            padding: 0.5rem 0.75rem;
            background: rgba(0, 115, 108, 0.96);
            backdrop-filter: blur(6px);
            justify-content: flex-start;
        }

        .army-search-wrapper {
            flex: 1 1 100%;
        }

        .army-search-input {
            width: 100%;
            box-sizing: border-box;
        }
    }

    .language-switcher .header-link {
        min-width: 2rem;
        height: 2rem;
        padding: 0 0.4rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        color: #ffffff;
        font-size: 0.82rem;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
    }

    .language-switcher .header-link:hover {
        background: rgba(255, 255, 255, 0.24);
    }

    .language-switcher .github-link svg,
    .language-switcher .header-link svg {
        width: 1.1rem;
        height: 1.1rem;
        fill: currentColor;
    }

    .army-search-wrapper {
        position: relative;
    }

    .army-search-input {
        height: 2rem;
        padding: 0 0.7rem;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        color: #ffffff;
        font-size: 0.82rem;
        outline: none;
        width: 12rem;
    }

    .army-search-input::placeholder {
        color: rgba(255, 255, 255, 0.65);
    }

    .army-search-input:focus {
        background: rgba(255, 255, 255, 0.24);
        border-color: rgba(255, 255, 255, 0.7);
    }

    .army-search-dropdown {
        display: none;
        position: absolute;
        top: calc(100% + 0.35rem);
        left: 0;
        min-width: 100%;
        background: #ffffff;
        border: 1px solid var(--theme-green-mid);
        border-radius: 0.7rem;
        padding: 0.25rem;
        box-shadow: 0 0.45rem 1.2rem rgba(0, 0, 0, 0.15);
        z-index: 30;
        max-height: 16rem;
        overflow-y: auto;
    }

    .army-search-dropdown.is-open {
        display: block;
    }

    .army-search-option {
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--theme-text);
        border-radius: 0.5rem;
        padding: 0.42rem 0.6rem;
        text-align: left;
        cursor: pointer;
        font-size: 0.85rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .army-search-option:hover,
    .army-search-option.is-active {
        background: var(--theme-green-soft);
    }

    .language-switcher .language-buttons {
        position: relative;
    }

    .language-switcher .language-toggle {
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        color: #ffffff;
        cursor: pointer;
        min-width: 4.7rem;
        height: 2.15rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        padding: 0 0.6rem;
    }

    .language-switcher .language-toggle:hover,
    .language-switcher .language-toggle[aria-expanded="true"] {
        background: rgba(255, 255, 255, 0.24);
    }

    .language-switcher .language-toggle .caret {
        font-size: 0.7rem;
        line-height: 1;
    }

    .language-switcher .language-toggle img,
    .language-switcher .lang-option img {
        width: 1rem;
        height: 1rem;
        display: block;
    }

    .language-switcher .language-menu {
        position: absolute;
        top: calc(100% + 0.35rem);
        right: 0;
        min-width: 7.5rem;
        background: #ffffff;
        border: 1px solid var(--theme-green-mid);
        border-radius: 0.7rem;
        padding: 0.25rem;
        box-shadow: 0 0.45rem 1.2rem rgba(0, 0, 0, 0.15);
        display: none;
    }

    .language-switcher .language-menu.is-open {
        display: block;
    }

    .language-switcher .lang-option {
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--theme-text);
        border-radius: 0.5rem;
        padding: 0.42rem 0.5rem;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        cursor: pointer;
        text-align: left;
    }

    .language-switcher .lang-option:hover,
    .language-switcher .lang-option[aria-selected="true"] {
        background: var(--theme-green-soft);
    }

    .box {
        background: #ffffff !important;
        color: var(--theme-text) !important;
        border: 1px solid var(--theme-green-mid);
        box-shadow: none;
    }

    .table,
    .table td,
    .table th {
        background: #ffffff !important;
        color: var(--theme-text) !important;
    }

    .table th,
    .table td {
        border-color: var(--theme-green) !important;
    }

    .table thead th {
        background: var(--theme-green) !important;
        color: #ffffff !important;
    }

    .table thead th a {
        color: #ffffff !important;
        text-decoration: none;
        font-weight: 700;
    }

    .table thead th.sortable {
        cursor: pointer;
        user-select: none;
    }

    .table thead th .sort-indicator {
        margin-left: 0.35rem;
        font-size: 0.9rem;
        opacity: 0.95;
    }

    .table tbody tr:hover td {
        background: #86d8cb !important;
        color: #ffffff !important;
    }

    .table tbody tr:hover a,
    .table tbody tr:hover strong {
        color: #ffffff !important;
    }

    .colminwidth {
        white-space: nowrap;
        min-width: 8ch;
    }

    a {
        color: var(--theme-green);
        font-weight: 600;
    }
</style>
